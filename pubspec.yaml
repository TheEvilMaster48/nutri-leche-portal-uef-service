name: nutri
description: Portal de Empleados Nutri Ecuador
publish_to: 'none'
version: 3.2.0+12

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WEBSOCKETS
  web_socket_channel: ^3.0.3

  # UTILIDADES Y ESTADO
  uuid: ^4.5.1
  provider: ^6.1.5
  shared_preferences: ^2.5.3

  # INFORMACIÓN DEL DISPOSITIVO
  device_info_plus: ^12.2.0

  # GEOLOCALIZACIÓN (módulo Rutas)
  # Solo posición puntual en primer plano: sella lat/lon al abrir y cerrar cada
  # evento de un viaje. NO se usa tracking en background, así que la app no
  # declara ACCESS_BACKGROUND_LOCATION ni foreground service.
  geolocator: ^14.0.2

  # SELECCIÓN DE ARCHIVOS
  file_picker: ^10.3.6

  # LOCALIZACIÓN E INTERNACIONALIZACIÓN
  flutter_native_splash: ^2.4.7
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # ARCHIVOS Y MULTIMEDIA
  path_provider: ^2.1.5
  # Reproductor con decodificación por software (libmpv) -> compatible con
  # tablets cuyo decodificador hardware (OMX.qcom...) no soporta H.264 High@1080p
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  open_filex: ^4.7.0
  flutter_pdfview: ^1.4.3
  media_store_plus: ^0.1.3
  permission_handler: ^11.3.1
  url_launcher: ^6.3.2

  # PDF Y HERRAMIENTAS
  pdf: ^3.11.3
  printing: ^5.14.2

  # ÍCONOS Y ESTILO
  flutter_launcher_icons: ^0.14.4
  http: ^1.6.0
  table_calendar: ^3.2.0
  universal_html: ^2.3.0
  mime: ^2.0.0

  # FIREBASE
  flutter_local_notifications: ^19.5.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10

  # BADGE EN EL ÍCONO DE LA APP (pendientes en springboard iOS / launcher Android)
  app_badge_plus: ^1.2.2
  timezone: ^0.10.1
  # GEOCODIFICACIÓN INVERSA (módulo Logo Nutri)
  # Traduce las coordenadas del GPS al nombre de la ciudad. Usa el geocoder del
  # sistema (Geocoder en Android, CLGeocoder en iOS), así que NO funciona sin
  # datos: cuando falla, el campo queda para escribirlo a mano.
  geocoding: ^5.0.0

  # OVERRIDE — FORZAR LA NUEVA VERSIÓN DEL PLUGIN
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.33
  # 3.4.2+ usa FlutterPluginRegistrar.addSceneDelegate, API que no existe en
  # Flutter 3.35. Fijamos 3.4.1 (última sin UIScene lifecycle) hasta subir Flutter.
  volume_controller: 3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # IMÁGENES Y LOGOS
  assets:
    - assets/icono/calendario.jpg
    - assets/icono/correo.jpg
    - assets/icono/cumpleanos.jpg
    - assets/icono/cumpleanosdetalle.jpg
    - assets/icono/detalleevento.jpg
    - assets/icono/eventos.jpg
    - assets/icono/femenino.jpg
    - assets/icono/masculino.jpg
    - assets/icono/nutri.gif
    - assets/icono/nutri.png
    - assets/icono/logo_blanco.png
    - assets/icono/logo_azul.png
    - assets/icono/nutrileche.png
    - assets/icono/id.jpg
    - assets/icono/correo.jpg
    - assets/icono/telefono.jpg
    - assets/icono/area.jpg
    - assets/icono/modulos.jpg


# CONFIGURACIÓN DE ÍCONO DE APP
#
# Las dos imágenes de abajo se generan a partir de `logo_azul.png` y no se
# dibujan a mano: el logotipo es horizontal y el ícono es cuadrado, así que hay
# que centrarlo con margen. `icono_app.png` lleva el fondo blanco incorporado;
# `icono_app_foreground.png` va transparente y más chico porque Android recorta
# el ícono adaptativo a círculo, cuadrado o «squircle» según el launcher y solo
# garantiza el 66% central.
flutter_launcher_icons:
  android: true
  # iOS se mantiene a mano en ios/Runner/Assets.xcassets/AppIcon.appiconset:
  # lleva variantes para modo oscuro y tintado (iOS 18+) y un azul un poco más
  # claro, porque iOS oscurece el ícono al dibujarlo. Si se pone en true, este
  # paquete sobrescribe esas imágenes.
  ios: false
  image_path: "assets/icono/icono_app.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icono/icono_app_foreground.png"
  # iOS rechaza íconos con canal alfa; la imagen ya va sin él, esto es seguro.
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icono/icono_app.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

# CONFIGURACIÓN DE PANTALLA DE CARGA (SPLASH)
#
# Dos imágenes porque son dos mecanismos distintos: hasta Android 11 (y en iOS
# y web) el sistema dibuja `image` centrada sobre `color`; desde Android 12 la
# pantalla de arranque la controla el sistema y exige un lienzo de 1152x1152
# del que solo muestra el círculo central de 768 px.
#
# `android_gravity` pasó de `fill` a `center`: el logotipo es horizontal y
# `fill` lo estiraba a pantalla completa, deformándolo.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icono/splash_logo.png
  android: true
  ios: true
  web: true
  android_gravity: center
  ios_content_mode: center
  web_image_mode: center

  android_12:
    image: assets/icono/splash_android12.png
    color: "#FFFFFF"